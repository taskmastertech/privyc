[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privyc"
version = "0.1.0"
description = "A lightweight, ergonomic CSV reader for Python applications"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Vinay", email = "taskmastertucker@gmail.com"}
]
keywords = ["csv", "data", "reader", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/taskmastertech/privyc"
Issues = "https://github.com/taskmastertech/privyc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
privyc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
